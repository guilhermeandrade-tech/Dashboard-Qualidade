<script>

const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MESES_NOME=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Cor da categoria pra exibir em pílula
const CAT_COLOR={Gramatical:['#fde68a','#92400e'],Estrutural:['#bfdbfe','#1e40af'],'Metodológico':['#ddd6fe','#5b21b6'],'Técnico':['#bbf7d0','#166534']};

// ============================================================
// Compilado: média ponderada por volume entre Laudo e Pré-Laudo
// Regra: (NotaL × QtdL + NotaPL × QtdPL) / (QtdL + QtdPL)
// ============================================================
function compilado(L,PL){
  const tot=L.total+PL.total;
  const wavg=(a,b)=>tot===0?0:((a||0)*L.total+(b||0)*PL.total)/tot;
  function mergePersonsErrs(la,pa,laErrs,paErrs){
    const map={};
    (la||[]).forEach((p,i)=>{ map[p.name]={name:p.name,lc:p.count,ln:p.nota,pc:0,pn:0,le:(laErrs&&laErrs[i])||[],pe:[]}; });
    (pa||[]).forEach((p,i)=>{
      if(map[p.name]){map[p.name].pc=p.count;map[p.name].pn=p.nota;map[p.name].pe=(paErrs&&paErrs[i])||[];}
      else map[p.name]={name:p.name,lc:0,ln:0,pc:p.count,pn:p.nota,le:[],pe:(paErrs&&paErrs[i])||[]};
    });
    const merged=Object.values(map).map(x=>{
      const c=x.lc+x.pc;
      const n=c===0?0:(x.ln*x.lc+x.pn*x.pc)/c;
      const eMap={};
      [...x.le,...x.pe].forEach(e=>{
        if(!eMap[e.label]) eMap[e.label]={label:e.label,count:0,cat:e.cat};
        eMap[e.label].count+=e.count;
      });
      const errs=Object.values(eMap).sort((a,b)=>b.count-a.count).slice(0,5);
      return{name:x.name,count:c,nota:n,errs};
    }).sort((a,b)=>b.count-a.count);
    return{list:merged.map(m=>({name:m.name,count:m.count,nota:m.nota})),errs:merged.map(m=>m.errs)};
  }
  function mergeErrs(la,pa){
    const map={};
    [...(la||[]),...(pa||[])].forEach(e=>{
      if(!map[e.label]) map[e.label]={label:e.label,count:0,cat:e.cat};
      map[e.label].count+=e.count;
    });
    return Object.values(map).sort((a,b)=>b.count-a.count);
  }
  function mergeCausas(la,pa){
    const map={};
    [...(la||[]),...(pa||[])].forEach(e=>{ map[e.causa]=(map[e.causa]||0)+e.count; });
    return Object.entries(map).map(([causa,count])=>({causa,count})).sort((a,b)=>b.count-a.count);
  }
  function mergeClientes(la,pa){
    const map={};
    for(const c of la||[]) map[c.name]={name:c.name,total:c.total,reabs:c.reabs};
    for(const c of pa||[]){
      if(map[c.name]){map[c.name].total+=c.total;map[c.name].reabs+=c.reabs;}
      else map[c.name]={name:c.name,total:c.total,reabs:c.reabs};
    }
    return Object.values(map).map(x=>({
      name:x.name,total:x.total,reabs:x.reabs,
      kpi:x.total===0?100:(1-x.reabs/x.total)*100
    })).sort((a,b)=>a.kpi-b.kpi);
  }
  function mergeEsp(la,pa){
    const map={};
    [...(la||[]),...(pa||[])].forEach(e=>{
      if(!map[e.texto]) map[e.texto]={texto:e.texto,naos:0,total:0,cliente:e.cliente};
      map[e.texto].naos+=e.naos;
      map[e.texto].total+=e.total;
    });
    return Object.values(map).sort((a,b)=>b.naos-a.naos);
  }
  const eM=mergePersonsErrs(L.execList,PL.execList,L.execErrs,PL.execErrs);
  const rM=mergePersonsErrs(L.revList,PL.revList,L.revErrs,PL.revErrs);
  const aM=mergePersonsErrs(L.aprovList,PL.aprovList,L.aprovErrs,PL.aprovErrs);
  return{
    total:tot,reabs:L.reabs+PL.reabs,reabsOp:(L.reabsOp||0)+(PL.reabsOp||0),
    notaTotal:wavg(L.notaTotal,PL.notaTotal),conclusividade:wavg(L.conclusividade,PL.conclusividade),
    kpiReab:wavg(L.kpiReab,PL.kpiReab),kpiReabOp:wavg(L.kpiReabOp,PL.kpiReabOp),
    notaGramPct:wavg(L.notaGramPct,PL.notaGramPct),notaEstPct:wavg(L.notaEstPct,PL.notaEstPct),
    notaMetPct:wavg(L.notaMetPct,PL.notaMetPct),notaTecPct:wavg(L.notaTecPct,PL.notaTecPct),
    execList:eM.list,execErrs:eM.errs,
    revList:rM.list,revErrs:rM.errs,
    aprovList:aM.list,aprovErrs:aM.errs,
    errList:mergeErrs(L.errList,PL.errList),
    causaList:mergeCausas(L.causaList,PL.causaList),
    clienteList:mergeClientes(L.clienteList,PL.clienteList),
    espList:mergeEsp(L.espList,PL.espList)
  };
}

function sincTag(u){
  if(!u)return'';
  const diff=Math.round((Date.now()-new Date(u))/60000);
  const txt=diff<1?'agora':diff<60?diff+'min':Math.round(diff/60)+'h';

// extractContent removido — dados vêm direto do Supabase como JSON

function parseNum(v){
  if(v===''||v===null||v===undefined)return NaN;
  return Number(String(v).replace(',','.'));
}

function parseCache(content){
  const raw={};
  // Desescape markdown: \_ → _, \| → |, \\ → \
  const unesc=s=>String(s||'').replace(/\\([_|\\])/g,'$1');
  content.split('\n').filter(l=>l.trim()&&!l.includes('|:-')&&!l.includes(':-|')).forEach(line=>{
    const cells=line.split(/(?<!\\)\|/).map(c=>unesc(c).trim()).filter(c=>c);
    if(cells.length<2)return;
    const key=cells[0];
    if(!key||key==='field'||key==='value')return;
    const val=cells.slice(1).join('|');
    const num=parseNum(val);
    raw[key]=(!isNaN(num)&&val!=='')?num:val;
  });

  const n=k=>{const v=raw[k];return typeof v==='number'?v:(!isNaN(parseNum(v))?parseNum(v):0);};
  const s=k=>String(raw[k]||'');

  // Split tolerante a ; (novo) ou | (legado)
  const splitFields=v=>String(v||'').split(/;|\|/);
  function pList(pfx,base){
    const list=[];
    for(let i=0;i<n(pfx+'_'+base+'Count');i++){
      const v=s(pfx+'_'+base+'_'+i);if(!v)continue;
      const p=splitFields(v);
      list.push({name:p[0],count:Number(p[1])||0,nota:parseNum(p[2])||0});
    }return list;
  }
  function pErrsList(pfx,base,idx){
    const list=[];
    const cnt=n(pfx+'_'+base+'Errs_'+idx+'_count');
    for(let j=0;j<cnt;j++){
      const v=s(pfx+'_'+base+'Errs_'+idx+'_'+j);if(!v)continue;
      const p=splitFields(v);
      list.push({label:p[0],count:Number(p[1])||0,cat:p[2]||''});
    }return list;
  }
  function eList(pfx){
    const list=[];
    for(let i=0;i<n(pfx+'_errCount');i++){
      const v=s(pfx+'_err_'+i);if(!v)continue;
      const p=splitFields(v);
      list.push({label:p[0],count:Number(p[1])||0,cat:p[2]||''});
    }return list;
  }
  function cList(pfx){
    const list=[];
    for(let i=0;i<n(pfx+'_causaCount');i++){
      const v=s(pfx+'_causa_'+i);if(!v)continue;
      const p=splitFields(v);list.push({causa:p[0],count:Number(p[1])||0});
    }return list;
  }
  function clList(pfx){
    const list=[];
    for(let i=0;i<n(pfx+'_clienteCount');i++){
      const v=s(pfx+'_cliente_'+i);if(!v)continue;
      const p=splitFields(v);
      list.push({name:p[0],total:Number(p[1])||0,reabs:Number(p[2])||0,kpi:parseNum(p[3])||0});
    }return list;
  }
  function espList(pfx){
    const list=[];
    for(let i=0;i<n(pfx+'_espCount');i++){
      const v=s(pfx+'_esp_'+i);if(!v)continue;
      const p=splitFields(v);
      list.push({texto:p[0],naos:Number(p[1])||0,total:Number(p[2])||0,cliente:p[3]||''});
    }return list;
  }
  function tab(pfx){
    const exec=pList(pfx,'exec');
    const rev=pList(pfx,'rev');
    const aprov=pList(pfx,'aprov');
    return{
    total:n(pfx+'_total'),reabs:n(pfx+'_reabs'),reabsOp:n(pfx+'_reabsOp'),
    notaTotal:n(pfx+'_notaTotal'),conclusividade:n(pfx+'_conclusividade'),
    kpiReab:n(pfx+'_kpiReab'),kpiReabOp:n(pfx+'_kpiReabOp'),
    notaGramPct:n(pfx+'_notaGramPct'),notaEstPct:n(pfx+'_notaEstPct'),
    notaMetPct:n(pfx+'_notaMetPct'),notaTecPct:n(pfx+'_notaTecPct'),
    execList:exec,revList:rev,aprovList:aprov,
    execErrs:exec.map((_,i)=>pErrsList(pfx,'exec',i)),
    revErrs:rev.map((_,i)=>pErrsList(pfx,'rev',i)),
    aprovErrs:aprov.map((_,i)=>pErrsList(pfx,'aprov',i)),
    errList:eList(pfx),causaList:cList(pfx),clienteList:clList(pfx),
    espList:espList(pfx)
  };}

  const mesesCount=n('meses_count');
  if(mesesCount>0){
    const meses=[];
    for(let i=0;i<mesesCount;i++) meses.push(s('mes_'+i));
    const byMonth={};
    for(const m of meses){
      const pfx=m.replace('-','_');
      byMonth[m]={L:tab(pfx+'_L'),PL:tab(pfx+'_PL')};
    }
    return{updatedAt:s('updatedAt'),meses,byMonth,formato:'multi'};
  }
  return{updatedAt:s('updatedAt'),meses:['legado'],byMonth:{legado:{L:tab('L'),PL:tab('PL')}},formato:'legado'};
}

// ============================================================
// Tickets Intercom — parse + render
// ============================================================
function mapSupabaseTickets(rows){
  return (rows||[]).map(r=>({
    id:r.id, empresa:r.empresa, mes:r.mes_fechamento,
    classificacao:r.classificacao, titulo:r.titulo, resumo:r.resumo,
    abertura:r.abertura, ultimo_retorno:r.ultimo_retorno,
    sla_corridas:r.sla_horas_corridas||0, sla_uteis:r.sla_horas_uteis||0,
    status:r.status, link:r.link
  }));
}

function mapSupabaseScores(rows){
  if(!rows||!rows.length)return null;
  const mesSet=new Set(rows.map(s=>s.mes));
  const meses=[...mesSet].sort((a,b)=>b>a?1:a>b?-1:0)
  const byMonth={};
  for(const mes of meses){
    const Lr=rows.find(s=>s.mes===mes&&s.tipo==='L')||{};
    const PLr=rows.find(s=>s.mes===mes&&s.tipo==='PL')||{};
    byMonth[mes]={L:mapTab(Lr),PL:mapTab(PLr)};
  }
  const updatedAt=rows.reduce((l,s)=>s.updated_at>l?s.updated_at:l,'');
  return{meses,byMonth,formato:'multi',updatedAt};
}

function mapTab(s){
  return{
    total:s.total||0,reabs:s.reabs||0,reabsOp:s.reabs_op||0,
    notaTotal:s.nota_total||0,conclusividade:s.conclusividade||0,
    kpiReab:s.kpi_reab||0,kpiReabOp:s.kpi_reab_op||0,
    notaGramPct:s.nota_gram_pct||0,notaEstPct:s.nota_est_pct||0,
    notaMetPct:s.nota_met_pct||0,notaTecPct:s.nota_tec_pct||0,
    execList:s.exec_list||[],revList:s.rev_list||[],aprovList:s.aprov_list||[],
    execErrs:(s.exec_list||[]).map(e=>e.errs||[]),revErrs:(s.rev_list||[]).map(e=>e.errs||[]),aprovErrs:(s.aprov_list||[]).map(e=>e.errs||[]),
    errList:s.err_list||[],causaList:s.causa_list||[],
    clienteList:s.cliente_list||[],espList:s.esp_list||[]
  };
}

function swTicketsClass(cls){_ticketsClass=_ticketsClass===cls?'':cls;if(_data)render(_data);}
function swTicketsStatus(s){_ticketsStatus=_ticketsStatus===s?'':s;if(_data)render(_data);}

function renderTickets(){
  const mesD=_data&&_activeMes?_data.byMonth[_activeMes]:null;
  const lT=mesD?mesD.L.total:0,plT=mesD?mesD.PL.total:0,cT=lT+plT;
  const tckT=_ticketsData?_ticketsData.length:0;
  const tabsHtml=`<div class="tabs">
    <button class="tab" onclick="swTab('C')">🔀 Compilado ${pill(cT,'var(--plt)','var(--purple)')}</button>
    <button class="tab" onclick="swTab('L')">📄 Laudo ${pill(lT,'var(--blt)','var(--blue)')}</button>
    <button class="tab" onclick="swTab('PL')">📝 Pré Laudo ${pill(plT,'var(--blt)','var(--blue)')}</button>

        <th>SLA Útil</th><th>Status</th><th>Resumo</th><th></th>

  bar.style.display='flex';
  bar.innerHTML=meses.map((m,i)=>{

    return`<button class="mes-btn ${m===_activeMes?'active':''}" onclick="swMes('${m}')">
      ${lbl}${isCur?' <span style="font-size:8px;opacity:.7">● atual</span>':''}
    </button>`;
  }).join('');
}

      <p style="font-size:9px;color:var(--light)">sem reab. operacional</p>
    </div>
  </div>

  <div class="g2">
    <div class="card" style="margin-bottom:0">
      <div style="font-size:13px;font-weight:700;margin-bottom:14px">📊 Score por Dimensão</div>
      ${dims.map(d=>`<div class="dim-row">
        <div class="dim-label">${d.icon} ${d.label}</div>
        ${bar(d.val,nc(d.val))}
        <div class="dim-val" style="color:${nc(d.val)}">${fmt1(d.val)}%</div>
      </div>`).join('')}
    </div>
    <div class="card" style="margin-bottom:0">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">🔄 Causas de Reabertura</div>
      ${t.causaList.length>0?t.causaList.map(c=>`<div class="err-row">
        <div class="err-label" title="${c.causa}">${c.causa}</div>
        <div class="err-bar">${bar(c.count/maxCausa*100,'var(--orange)',5)}</div>
        <div class="err-count" style="color:var(--orange)">${c.count}</div>
      </div>`).join(''):'<div class="empty">✅ Sem reaberturas</div>'}
    </div>
  </div>

  ${clienteSection}

  <div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">🚨 Critérios com Mais Erros
      <span style="font-size:10px;color:var(--light);font-weight:400;margin-left:6px">NÃO atendidos — ${lbl}</span>
    </div>
    ${t.errList.length>0?t.errList.slice(0,20).map(e=>`<div class="err-row">
      <div class="err-label" title="${e.label}">${e.label}${catPill(e.cat)}</div>
      <div class="err-bar">${bar(e.count/maxErr*100,'var(--red)',5)}</div>
      <div class="err-count" style="color:var(--red)">${e.count}</div>
    </div>`).join(''):'<div class="empty">✅ Nenhum erro registrado</div>'}
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px">👤 Nota por Pessoa
      <span style="font-size:10px;color:var(--light);font-weight:400;margin-left:6px">clique na ▾ para ver os erros — ${_activePerson==='exec'?'erros do executor':'erros encontrados pelo '+pLabels[_activePerson].toLowerCase()}</span>
    </div>
    <div class="ptabs">
      ${['exec','rev','aprov'].map(k=>`<button class="ptab ${_activePerson===k?'active':''}" onclick="swPerson('${k}')">${pLabels[k]}</button>`).join('')}
    </div>
    ${pArr.length>0?`<table><thead><tr><th style="width:24px"></th><th>#</th><th>Nome</th><th>Casos</th><th>Nota Média</th><th style="width:90px"></th></tr></thead><tbody>
    ${pArr.map((p,i)=>{
      const origList=_activePerson==='exec'?t.execList:_activePerson==='rev'?t.revList:t.aprovList;
      const origErrs=_activePerson==='exec'?t.execErrs:_activePerson==='rev'?t.revErrs:t.aprovErrs;
      const origIdx=(origList||[]).findIndex(x=>x.name===p.name);
      const errs=(origErrs&&origIdx>=0)?(origErrs[origIdx]||[]):[];
      const expanded=_expandedIdx===i;
      const maxPe=errs[0]?errs[0].count:1;
      return `<tr style="background:${i%2?'#fafbfd':''};cursor:pointer" onclick="toggleExpand(${i})">
        <td style="color:var(--mid);font-size:12px;text-align:center">${expanded?'▾':'▸'}</td>
        <td style="color:var(--light)">${i+1}</td>
        <td style="font-weight:600">${p.name}</td>
        <td>${pill(p.count,'var(--blt)','var(--blue)')}</td>
        <td style="font-weight:800;color:${nc(p.nota)}">${fmt2(p.nota)}%</td>
        <td>${bar(p.nota,nc(p.nota),5)}</td>
      </tr>${expanded?`<tr><td colspan="6" style="background:#f8fafc;padding:10px 14px">
        <div style="font-size:10px;color:var(--mid);font-weight:700;text-transform:uppercase;margin-bottom:8px">Top erros · ${_activePerson==='exec'?'cometidos por':'encontrados por'} ${p.name}</div>
        ${errs.length>0?errs.map(e=>`<div class="err-row">
          <div class="err-label" title="${e.label}">${e.label}${catPill(e.cat)}</div>
          <div class="err-bar">${bar(e.count/maxPe*100,'var(--red)',5)}</div>
          <div class="err-count" style="color:var(--red)">${e.count}</div>
        </div>`).join(''):'<div class="empty">✅ Sem erros registrados</div>'}
      </td></tr>`:''}`;
    }).join('')}
    </tbody></table>`:'<div class="empty">Sem dados de pessoas</div>'}
  </div>

  ${(()=>{const validEsp=(t.espList||[]).filter(e=>e.total>0&&e.texto&&!/^\d+$/.test(String(e.texto).trim()));return validEsp.length>0?`<div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">⚠️ Falhas em Especificidades dos Clientes
      <span style="font-size:10px;color:var(--light);font-weight:400;margin-left:6px">acordos que estamos falhando em cumprir — ${lbl}</span>
    </div>
    <table><thead><tr><th>#</th><th>Especificidade</th><th>Cliente</th><th>Falhas</th><th>Total avaliações</th><th>Taxa Falha</th></tr></thead><tbody>
    ${validEsp.map((e,i)=>{
      const tx=e.total>0?(e.naos/e.total)*100:0;
      return `<tr style="background:${i%2?'#fafbfd':''}">
        <td style="color:var(--light)">${i+1}</td>
        <td style="font-size:11px;line-height:1.4" title="${e.texto}">${e.texto}</td>
        <td style="font-size:10px;color:var(--mid)">${e.cliente||'—'}</td>
        <td style="font-weight:800;color:var(--red)">${e.naos}</td>
        <td>${pill(e.total,'var(--blt)','var(--blue)')}</td>
        <td style="font-weight:700;color:${tx>20?'var(--red)':tx>10?'var(--orange)':'var(--amber)'}">${fmt1(tx)}%</td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`:'';})()}`;

  const ctx=document.getElementById('ch-ring');
  if(ctx){
    const c=t.notaTotal>=95?'#16a34a':t.notaTotal>=90?'#d97706':'#dc2626';
    _charts.push(new Chart(ctx,{type:'doughnut',data:{datasets:[{data:[t.notaTotal,100-t.notaTotal],backgroundColor:[c,'#f1f5f9'],borderWidth:0}]},options:{responsive:false,plugins:{legend:{display:false},tooltip:{enabled:false}},cutout:'70%'}}));
  }
}

function swTab(t){_activeTab=t;_expandedIdx=-1;if(_data)render(_data);}
function swPerson(p){_activePerson=p;_expandedIdx=-1;if(_data)render(_data);}
function swMes(m){_activeMes=m;_expandedIdx=-1;if(_data)render(_data);}
function toggleExpand(i){_expandedIdx=_expandedIdx===i?-1:i;if(_data)render(_data);}

// waitForCowork removido — não necessário no Vercel

async function doRefresh(){
  const rfb=document.getElementById('rfb');
  rfb.disabled=true;rfb.innerHTML='<span class="spin">⟳</span> Buscando...';
  try{
    const [{data:ticketsRows,error:tErr},{data:scoresRows,error:sErr}]=await Promise.all([
      _sb.from('tickets').select('*').order('abertura',{ascending:false}),
      _sb.from('quality_scores').select('*')
    ]);
    if(tErr)console.warn('Tickets error:',tErr.message);
    if(ticketsRows)_ticketsData=mapSupabaseTickets(ticketsRows);
    const mapped=mapSupabaseScores(scoresRows);
    if(mapped){
      render(mapped);
    }else{
      _data={meses:[],byMonth:{},formato:'empty',updatedAt:null};
      document.getElementById('hdr-sub').innerHTML='<span style="color:rgba(255,255,255,.4);font-size:9px">Qualidade pendente de migração</span>';
      if(_activeTab==='T')renderTickets();
      else document.getElementById('ct').innerHTML=`<div class="tabs">
        <button class="tab" onclick="swTab('C')">🔀 Compilado</button>
        <button class="tab" onclick="swTab('L')">📄 Laudo</button>
        <button class="tab" onclick="swTab('PL')">📝 Pré Laudo</button>
        <button class="tab active" onclick="swTab('T')" style="background:var(--teal);color:#fff">📨 Tickets</button>
      </div>
      <div style="padding:40px;text-align:center;color:var(--mid);font-size:13px;background:#fff;border-radius:12px;border:1px solid var(--brd)">
        📊 Dados de qualidade ainda não migrados para o Supabase.<br>
        <span style="font-size:11px;color:var(--light);margin-top:6px;display:block">Atualize o Apps Script para escrever na tabela <code>quality_scores</code>.</span>
      </div>`;
    }
  }catch(e){
    document.getElementById('ct').innerHTML=`<div style="padding:30px;text-align:center;color:var(--red);font-size:13px">❌ Erro: ${e.message}</div>`;
  }finally{
    rfb.disabled=false;rfb.textContent='🔄 Atualizar';
  }
}

(async function(){ await doRefresh(); })();



// ── Seção diária ──
(async function initDailySection() {
  try {
    const { data: daily, error } = await _sb.from('quality_scores_daily').select('*').order('data', { ascending: false }).limit(120);
    if (error || !daily || !daily.length) {
      document.getElementById('panorama-dia').innerHTML = '<p style="color:var(--light);font-size:12px;padding:4px 0">Sem dados diários ainda.</p>';
      return;
    }
    const lDaily = daily.filter(d => d.tipo === 'L').sort((a,b) => a.data > b.data ? 1 : -1);
    const plDaily = daily.filter(d => d.tipo === 'PL').sort((a,b) => a.data > b.data ? 1 : -1);
    function fmtDate(d) { if (!d) return ''; const p = d.split('-'); return p[2]+'/'+p[1]; }
    function nota(v) { return v != null ? v.toFixed(1) : '--'; }
    function colorFor(v) { return v == null ? 'var(--light)' : v >= 95 ? 'var(--green)' : v >= 85 ? 'var(--orange)' : 'var(--red)'; }
    const allDates = [...new Set(daily.map(d => d.data))].sort();
    const yDate = allDates[allDates.length - 1];
    const yL = lDaily.find(d => d.data === yDate);
    const yPL = plDaily.find(d => d.data === yDate);
    const notaL = yL ? yL.nota_total : null;
    const notaPL = yPL ? yPL.nota_total : null;
    const notaGeral = (notaL != null && notaPL != null) ? (notaL + notaPL) / 2 : (notaL != null ? notaL : notaPL);
    // Executores
    const execMap = {};
    [[yL,'L'],[yPL,'PL']].forEach(function(pair) {
      const rec = pair[0]; if (!rec || !rec.exec_list) return;
      try {
        const list = typeof rec.exec_list === 'string' ? JSON.parse(rec.exec_list) : rec.exec_list;
        list.forEach(function(e) { if (!e.executor) return; if (!execMap[e.executor]) execMap[e.executor] = []; execMap[e.executor].push(e.nota); });
      } catch(err) {}
    });
    const execArr = Object.entries(execMap).map(function(en) {
      const valid = en[1].filter(function(n){ return n != null; });
      const avg = valid.length ? valid.reduce(function(a,b){ return a+b; }, 0) / valid.length : null;
      return { name: en[0], avg: avg, count: en[1].length };
    }).sort(function(a,b){ return (a.avg!=null?a.avg:0)-(b.avg!=null?b.avg:0); });
    const execRows = execArr.map(function(e) {
      return '<tr><td style="padding:4px 0;font-size:12px;color:var(--text)">'+e.name+'</td><td style="padding:4px 0;font-size:13px;font-weight:700;text-align:right;color:'+colorFor(e.avg)+'">'+nota(e.avg)+'</td><td style="padding:4px 0;font-size:10px;text-align:right;color:var(--light);padding-left:8px">'+e.count+' laudo'+(e.count!==1?'s':'')+'</td></tr>';
    }).join('');
    // Piores laudos
    const allLaudos = [];
    [[yL,'L'],[yPL,'PL']].forEach(function(pair) {
      const rec = pair[0]; const tipo = pair[1]; if (!rec || !rec.laudo_list) return;
      try {
        const list = typeof rec.laudo_list === 'string' ? JSON.parse(rec.laudo_list) : rec.laudo_list;
        list.slice(0,20).forEach(function(l){ allLaudos.push(Object.assign({}, l, {tipo:tipo})); });
      } catch(err) {}
    });
    allLaudos.sort(function(a,b){ return (a.nota!=null?a.nota:999)-(b.nota!=null?b.nota:999); });
    const laudoRows = allLaudos.slice(0,8).map(function(l) {
      return '<tr><td style="padding:4px 0;font-size:11px;color:var(--light)">'+l.tipo+'</td><td style="padding:4px 0;font-size:12px;color:var(--text)">'+(l.demanda||'--')+'</td><td style="padding:4px 0;font-size:12px;color:var(--text)">'+(l.executor||'--')+'</td><td style="padding:4px 0;font-size:13px;font-weight:700;text-align:right;color:'+colorFor(l.nota)+'">'+nota(l.nota)+'</td></tr>';
    }).join('');
    // Dimensoes no formato Score por Dimensao (barra .bw)
    const dims = [['Gramática',yL?yL.nota_gram_pct:null,yPL?yPL.nota_gram_pct:null],['Estrutural',yL?yL.nota_est_pct:null,yPL?yPL.nota_est_pct:null],['Metodológico',yL?yL.nota_met_pct:null,yPL?yPL.nota_met_pct:null],['Técnico',yL?yL.nota_tec_pct:null,yPL?yPL.nota_tec_pct:null]];
    const dimRows = dims.map(function(dim) {
      const vL=dim[1]; const vPL=dim[2];
      const vG=(vL!=null&&vPL!=null)?(vL+vPL)/2:(vL!=null?vL:vPL);
      const col=colorFor(vG);
      const w=vG!=null?Math.min(100,Math.max(0,vG)).toFixed(1)+'%':'0%';
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'
        +'<span style="font-size:12px;color:var(--mid);min-width:90px">'+dim[0]+'</span>'
        +'<div class="bw"><div class="bf" style="width:'+w+';background:'+col+'"></div></div>'
        +'<span style="font-size:12px;font-weight:700;color:'+col+';min-width:36px;text-align:right">'+nota(vG)+'</span>'
        +'</div>';
    }).join('');
    const pEl = document.getElementById('panorama-dia');
    pEl.innerHTML = '<div style="font-size:13px;font-weight:700;margin-bottom:14px">🗓️ Panorama '+fmtDate(yDate)+'</div>'
      +'<div class="ga3" style="margin-bottom:14px">'
      +'<div class="sc" style="border-left:3px solid var(--blue)"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--light);margin-bottom:6px">Nota Geral</div><div style="font-size:32px;font-weight:800;color:'+colorFor(notaGeral)+'">'+nota(notaGeral)+'</div></div>'
      +'<div class="sc" style="border-left:3px solid var(--blue)"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--light);margin-bottom:6px">Laudo</div><div style="font-size:26px;font-weight:800;color:'+colorFor(notaL)+'">'+nota(notaL)+'</div><div style="font-size:10px;color:var(--light);margin-top:2px">'+(yL?yL.total:0)+' laudos</div></div>'
      +'<div class="sc" style="border-left:3px solid var(--blue)"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--light);margin-bottom:6px">Pré-Laudo</div><div style="font-size:26px;font-weight:800;color:'+colorFor(notaPL)+'">'+nota(notaPL)+'</div><div style="font-size:10px;color:var(--light);margin-top:2px">'+(yPL?yPL.total:0)+' laudos</div></div>'
      +'</div>'
      +'<div style="font-size:13px;font-weight:700;margin-bottom:10px">📊 Score por Dimensão</div>'
      +dimRows
      +(execRows?'<div style="font-size:13px;font-weight:700;margin:14px 0 8px">Por executor</div><table style="width:100%;border-collapse:collapse">'+execRows+'</table>':'')
      +(laudoRows?'<div style="font-size:13px;font-weight:700;margin:14px 0 8px">Piores laudos</div><table style="width:100%;border-collapse:collapse"><tr style="font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--light)"><th style="text-align:left;padding:4px 0;font-weight:600">Tipo</th><th style="text-align:left;padding:4px 0;font-weight:600">Demanda</th><th style="text-align:left;padding:4px 0;font-weight:600">Executor</th><th style="text-align:right;padding:4px 0;font-weight:600">Nota</th></tr>'+laudoRows+'</table>':'');
    // Grafico diario (bar, escala 60-100)
    const [_yy,_mn]=_activeMes.split('-').map(Number);const _dim=new Date(_yy,_mn,0).getDate();const lastDays=Array.from({length:_dim},(_,i)=>`${_activeMes}-${String(i+1).padStart(2,'0')}`);
    function getVals(arr, dates) { return dates.map(function(d){ const r=arr.find(function(x){return x.data===d;}); return r&&r.nota_total!=null?Math.round(r.nota_total*10)/10:null; }); }
const barLabelPlugin={id:'barLabel',afterDatasetsDraw(chart){const {ctx}=chart;chart.data.datasets.forEach((ds,i)=>{const meta=chart.getDatasetMeta(i);if(!meta.hidden){meta.data.forEach((bar,j)=>{const v=ds.data[j];if(v!=null){ctx.save();ctx.fillStyle='#9ca3af';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(v,bar.x,bar.y-2);ctx.restore();}});}});}};    
        const ctxD = document.getElementById('chart-daily') && document.getElementById('chart-daily').getContext('2d');
    if (ctxD) {
      new Chart(ctxD, { plugins:[barLabelPlugin], type:'bar', data:{ labels:lastDays.map(fmtDate), datasets:[
        { label:'Laudo', data:getVals(lDaily,lastDays), backgroundColor:'rgba(59,130,246,0.85)', borderRadius:4 },
        { label:'Pré-Laudo', data:getVals(plDaily,lastDays), backgroundColor:'rgba(245,158,11,0.85)', borderRadius:4 }
      ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'var(--text)', font:{size:11} } } }, scales:{ x:{ ticks:{color:'var(--light)',font:{size:10}}, grid:{display:false} }, y:{ display:false } } });
    }
    // Grafico semanal
    function isoWeek(d) { const dt=new Date(d+'T00:00:00'); const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day); const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1)); return dt.getUTCFullYear()+'-W'+String(Math.ceil(((dt-ys)/86400000+1)/7)).padStart(2,'0'); }
    const weekMap = {};
    lDaily.concat(plDaily).forEach(function(r) {
      const wk=isoWeek(r.data); if (!weekMap[wk]) weekMap[wk]={L:[],PL:[]};
      if (r.tipo==='L'&&r.nota_total!=null) weekMap[wk].L.push(r.nota_total);
      if (r.tipo==='PL'&&r.nota_total!=null) weekMap[wk].PL.push(r.nota_total);
    });
    const weeks = Object.keys(weekMap).sort();
    function wavg(arr) { return arr.length?Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length*10)/10:null; }
    const ctxW = document.getElementById('chart-weekly') && document.getElementById('chart-weekly').getContext('2d');
    if (ctxW) {
      new Chart(ctxW, { plugins:[barLabelPlugin], type:'bar', data:{ labels:weeks, datasets:[
        { label:'Laudo', data:weeks.map(function(w){ return weekMap[w]?wavg(weekMap[w].L):null; }), backgroundColor:'rgba(59,130,246,0.85)', borderRadius:4 },
        { label:'Pré-Laudo', data:weeks.map(function(w){ return weekMap[w]?wavg(weekMap[w].PL):null; }), backgroundColor:'rgba(245,158,11,0.85)', borderRadius:4 }
      ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:'var(--text)', font:{size:11} } } }, scales:{ x:{ ticks:{color:'var(--light)',font:{size:10}}, grid:{display:false} }, y:{ display:false } } });
    }
  } catch(err) { console.error('Daily section error:', err); }
})();
